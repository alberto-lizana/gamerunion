<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Crear cuenta - Unión de Gamers</title>
    <link rel="stylesheet" th:href="@{/css/login.css}">
</head>
    <body>
        <div th:replace="~{layout :: layout(~{::title}, ~{::main})}">

            <title>Crear cuenta - Unión de Gamers</title>

            <main class="container d-flex align-items-center justify-content-center py-5">

                <div class="login-form-container">

                    <!-- Encabezado -->
                    <div class="mb-4">

                        <h1 class="login-heading">Crear una cuenta</h1>

                        <p class="login-subheading">
                            Forma parte de nuestra comunidad gamer.
                        </p>

                    </div>

                    <!-- Formulario -->
                    <form class="login-form"
                          th:action="@{/usuarios/crear}"
                          th:object="${usuario}"
                          method="post">

                        <!-- Nombre de usuario -->
                        <div class="login-form-group">

                            <input type="text"
                                   id="username"
                                   class="login-form-input"
                                   th:field="*{username}"
                                   th:classappend="${#fields.hasErrors('username')} ? ' is-invalid' : ''"
                                   placeholder=" "
                                   required>

                            <label for="username">Nombre de usuario</label>

                            <div class="invalid-feedback" th:errors="*{username}"></div>

                        </div>

                        <!-- Contraseña -->
                        <div class="login-form-group">

                            <input type="password"
                                   id="password"
                                   class="login-form-input"
                                   th:field="*{password}"
                                   th:classappend="${#fields.hasErrors('password')} ? ' is-invalid' : ''"
                                   placeholder=" "
                                   autocomplete="new-password"
                                   required>

                            <label for="password">Contraseña</label>

                            <div class="login-subheading">
                                <small>Mínimo 10 caracteres, con mayúsculas, minúsculas y un carácter especial.</small>
                            </div>

                            <div class="invalid-feedback" th:errors="*{password}"></div>

                        </div>

                        <h2 class="login-subheading text-center mb-0">
                            Información personal
                        </h2>

                        <!-- Nombre y apellido -->
                        <div class="row g-4">

                            <div class="col-md-6">

                                <div class="login-form-group">

                                    <input type="text"
                                           id="nombre"
                                           class="login-form-input"
                                           th:field="*{nombre}"
                                           th:classappend="${#fields.hasErrors('nombre')} ? ' is-invalid' : ''"
                                           placeholder=" "
                                           autocomplete="given-name"
                                           required>

                                    <label for="nombre">Nombre</label>

                                    <div class="invalid-feedback" th:errors="*{nombre}"></div>

                                </div>

                            </div>

                            <div class="col-md-6">

                                <div class="login-form-group">

                                    <input type="text"
                                           id="appat"
                                           class="login-form-input"
                                           th:field="*{appat}"
                                           th:classappend="${#fields.hasErrors('appat')} ? ' is-invalid' : ''"
                                           placeholder=" "
                                           autocomplete="family-name"
                                           required>

                                    <label for="appat">Apellido paterno</label>

                                    <div class="invalid-feedback" th:errors="*{appat}"></div>

                                </div>

                            </div>

                        </div>

                        <!-- Email -->
                        <div class="login-form-group">

                            <input type="email"
                                   id="email"
                                   class="login-form-input"
                                   th:field="*{email}"
                                   th:classappend="${#fields.hasErrors('email')} ? ' is-invalid' : ''"
                                   placeholder=" "
                                   autocomplete="email"
                                   required>

                            <label for="email">Correo electrónico</label>

                            <div class="invalid-feedback"
                                th:errors="*{email}"></div>

                        </div>

                        <!-- CSRF -->
                        <input type="hidden"
                               th:if="${_csrf != null}"
                               th:name="${_csrf.parameterName}"
                               th:value="${_csrf.token}">

                        <!-- Botón -->
                        <button type="submit" class="login-submit">
                            CREAR MI CUENTA
                        </button>

                    </form>

                    <hr class="login-divider">

                    <!-- Login -->
                    <div class="login-register">
                        ¿Ya tienes una cuenta?
                        <a th:href="@{/login}">Inicia sesión</a>
                    </div>

                </div>

            </main>

        </div>
    </body>
</html>
