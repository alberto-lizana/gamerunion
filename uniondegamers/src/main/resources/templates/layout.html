<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="es"
      th:fragment="layout(titulo, contenido)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" 
          content="width=device-width, 
          initial-scale=1">
    <title th:replace="${titulo}">Unión de Gamers</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" 
          rel="stylesheet" 
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" 
          crossorigin="anonymous">

    <link rel="stylesheet" 
          th:href="@{/css/evento-card.css}">
</head>
    <body>
        <nav class="navbar navbar-expand-md navbar-dark bg-dark">
            <div class="container">
                <a class="navbar-brand" th:href="@{/}">Unión de Gamers</a>

                <button class="navbar-toggler" type="button"
                        data-bs-toggle="collapse" data-bs-target="#menu">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <div class="collapse navbar-collapse" id="menu">
                    <ul class="navbar-nav me-auto">
                        <li class="nav-item">
                            <a class="nav-link" th:href="@{/}">Inicio</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" th:href="@{/eventos}">Eventos</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" th:href="@{/usuarios/perfil}" sec:authorize="isAuthenticated()">Perfil</a>
                        </li>
                    </ul>

                    <a class="btn btn-outline-light" th:href="@{/login}"
                       sec:authorize="!isAuthenticated()">
                       Iniciar sesión
                    </a>

                    <form th:action="@{/logout}" method="post" class="m-0"
                        sec:authorize="isAuthenticated()">
                        <button type="submit" class="btn btn-outline-light">Cerrar sesión</button>
                    </form>
                </div>
            </div>
        </nav>

        <!-- Aquí se inserta el contenido de cada página -->
        <main class="container py-4" th:replace="${contenido}">
        </main>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" 
                integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" 
                crossorigin="anonymous">
        </script>
    </body>
</html>
